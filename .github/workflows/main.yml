name: Docker Build and Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: harbor.xingzhan.cloud:9443
  IMAGE_NAME: public/labubu-web
  ECS_HOST: ${{ secrets.ECS_HOST }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Snyk CLI
        continue-on-error: true
        run: npm install -g snyk

      - name: Snyk Dependency Test (Build Gate)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk auth ${{ secrets.SNYK_TOKEN }}
          snyk test --severity-threshold=high --all-projects || echo "Snyk check skipped or failed, continuing..."

      - name: Log in to Harbor Registry
        if: github.event_name == 'push'
        run: |
          set -x
          echo "=== DNS & connectivity ==="
          nslookup harbor.xingzhan.cloud 2>&1 || true
          curl -v --connect-timeout 10 https://harbor.xingzhan.cloud:9443/ 2>&1 || true
          echo "=== Extract Harbor CA cert ==="
          echo | openssl s_client -connect harbor.xingzhan.cloud:9443 -servername harbor.xingzhan.cloud -showcerts 2>/dev/null | sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' > /tmp/harbor-ca.crt || true
          if [ -s /tmp/harbor-ca.crt ]; then
            echo "CA cert extracted, configuring..."
            sudo mkdir -p /etc/docker/certs.d/harbor.xingzhan.cloud:9443
            sudo cp /tmp/harbor-ca.crt /etc/docker/certs.d/harbor.xingzhan.cloud:9443/ca.crt
            sudo cp /tmp/harbor-ca.crt /usr/local/share/ca-certificates/harbor.crt 2>/dev/null || true
            sudo update-ca-certificates 2>/dev/null || true
          else
            echo "No CA cert, configuring insecure-registry..."
            echo '{"insecure-registries":["harbor.xingzhan.cloud:9443"]}' | sudo tee /etc/docker/daemon.json 2>/dev/null || true
          fi
          echo "=== Docker login ==="
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin 2>&1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=test

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        if: github.event_name == 'push'
        run: echo "Image pushed to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test"

      - name: Deploy to Alibaba Cloud ECS
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.ECS_HOST }}
          username: root
          password: ${{ secrets.ECS_SSH_PASSWORD }}
          port: 22
          script: |
            echo "=== Docker login to Harbor ==="
            echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.HARBOR_USERNAME }} --password-stdin

            echo "=== Pull latest image ==="
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test

            echo "=== Stop and remove old container ==="
            docker stop labubu-web 2>/dev/null || true
            docker rm labubu-web 2>/dev/null || true

            echo "=== Run new container ==="
            docker run -d \
              --name labubu-web \
              -p 3000:3000 \
              --restart always \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test

            echo "=== Verify deployment ==="
            docker ps | grep labubu-web
            echo "Deployment completed successfully!"
