name: Docker Build and Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: harbor.xingzhan.cloud:9443
  IMAGE_NAME: public/labubu-web
  ECS_HOST: ${{ secrets.ECS_HOST }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Snyk CLI
        continue-on-error: true
        run: npm install -g snyk

      - name: Snyk Dependency Test (Build Gate)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk auth ${{ secrets.SNYK_TOKEN }}
          snyk test --severity-threshold=high --all-projects || echo "Snyk check skipped or failed, continuing..."

      - name: Configure Docker trust for Harbor
        if: github.event_name == 'push'
        env:
          HARBOR_REGISTRY: ${{ env.REGISTRY }}
        run: |
          set -euo pipefail
          echo "=== DNS & connectivity check ==="
          nslookup "${HARBOR_REGISTRY%%:*}" 2>&1 || true
          curl -fsS --connect-timeout 10 "https://${HARBOR_REGISTRY}/" >/dev/null && echo "Harbor reachable" || echo "Harbor unreachable (continuing)"

          echo "=== Extract Harbor CA cert ==="
          : > /tmp/harbor-ca.crt
          echo | openssl s_client -connect "${HARBOR_REGISTRY}" -servername "${HARBOR_REGISTRY%%:*}" -showcerts 2>/dev/null \
            | sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' > /tmp/harbor-ca.crt || true

          if [ -s /tmp/harbor-ca.crt ]; then
            echo "CA cert extracted, configuring trust..."
            sudo mkdir -p "/etc/docker/certs.d/${HARBOR_REGISTRY}"
            sudo cp /tmp/harbor-ca.crt "/etc/docker/certs.d/${HARBOR_REGISTRY}/ca.crt"
            sudo cp /tmp/harbor-ca.crt /usr/local/share/ca-certificates/harbor.crt
            sudo update-ca-certificates
          else
            echo "No CA cert extracted, skipping trust configuration (registry uses public CA)."
          fi

      - name: Log in to Harbor Registry
        if: github.event_name == 'push'
        env:
          HARBOR_REGISTRY: ${{ env.REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          if [ -z "${HARBOR_USERNAME:-}" ] || [ -z "${HARBOR_PASSWORD:-}" ]; then
            echo "::error::HARBOR_USERNAME or HARBOR_PASSWORD secret is empty."
            exit 1
          fi
          echo "Logging in to ${HARBOR_REGISTRY} as ${HARBOR_USERNAME}..."
          printf '%s' "${HARBOR_PASSWORD}" | docker login "${HARBOR_REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin

      - name: Extract metadata
        id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=dev
            type=raw,value=test,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        if: github.event_name == 'push'
        run: echo "Image pushed to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev"

      - name: Deploy to Alibaba Cloud ECS
        if: github.event_name == 'push' && env.ECS_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.ECS_HOST }}
          username: root
          password: ${{ secrets.ECS_SSH_PASSWORD }}
          port: 22
          envs: HARBOR_REGISTRY,HARBOR_USERNAME,HARBOR_PASSWORD
          command_timeout: 15m
          script: |
            set -euo pipefail
            IMAGE_FULL="${HARBOR_REGISTRY}/${{ env.IMAGE_NAME }}:dev"
            CONTAINER_NAME=labubu-web

            if [ -z "${HARBOR_PASSWORD:-}" ] || [ -z "${HARBOR_USERNAME:-}" ]; then
              echo "::error::HARBOR_USERNAME or HARBOR_PASSWORD secret is empty."
              exit 1
            fi

            echo "=== Docker login to Harbor ==="
            printf '%s' "${HARBOR_PASSWORD}" | docker login "${HARBOR_REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin

            echo "=== Pull latest :dev image ==="
            docker pull "${IMAGE_FULL}"

            echo "=== Stop and remove old container ==="
            docker stop "${CONTAINER_NAME}" 2>/dev/null || true
            docker rm   "${CONTAINER_NAME}" 2>/dev/null || true

            echo "=== Run new container (host:3000 -> container:3000) ==="
            docker run -d \
              --name "${CONTAINER_NAME}" \
              -p 3000:3000 \
              --restart always \
              "${IMAGE_FULL}"

            echo "=== Verify deployment ==="
            docker ps | grep "${CONTAINER_NAME}"
            echo "Deployment completed successfully!"
